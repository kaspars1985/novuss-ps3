<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novuss</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236a3e1d'/%3E%3Crect x='4' y='4' width='24' height='24' fill='%23ecd9b0'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c3282f'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%23ecd9b0'/%3E%3C/svg%3E">
<meta name="description" content="Novuss — the Latvian cue board game, played by the Latvian Novuss Federation rules.">
<style>
  :root {
    --bg: #15110d;
    --bg-hi: #2b2118;
    --panel: rgba(28, 21, 15, 0.9);
    --panel-solid: #1f1812;
    --line: rgba(255, 234, 200, 0.13);
    --ink: #f3ead8;
    --muted: #b6a68b;
    --brass: #dcae58;
    --red: #c3282f;
    --black: #222;
    --good: #5cb987;
    --bad: #ec6a5f;
    --radius: 12px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--bg-hi) 0%, var(--bg) 68%) fixed, var(--bg);
    color: var(--ink);
    font: 15px/1.45 var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas#table { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; cursor: crosshair; }
  button { font: inherit; color: inherit; }

  /* ---- HUD ---- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: max(8px, env(safe-area-inset-top)) 14px 8px;
    background: linear-gradient(to bottom, rgba(16, 12, 9, 0.92), rgba(16, 12, 9, 0.6) 75%, transparent);
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .player { justify-self: start; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 10px; border-radius: var(--radius); border: 1px solid transparent; transition: background .25s, border-color .25s; }
  .player.right { justify-self: end; flex-direction: row-reverse; text-align: right; }
  .player.active { background: rgba(220, 174, 88, 0.12); border-color: rgba(220, 174, 88, 0.45); }
  .disc { width: 26px; height: 26px; border-radius: 50%; flex: none; position: relative; box-shadow: inset 0 -2px 3px rgba(0,0,0,.5), inset 0 2px 2px rgba(255,255,255,.18), 0 1px 3px rgba(0,0,0,.6); }
  .disc::after { content: ""; position: absolute; inset: 35%; border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0,0,0,.7); }
  .disc.red { background: radial-gradient(circle at 35% 30%, #e8555b, var(--red) 55%, #7c1217); }
  .disc.black { background: radial-gradient(circle at 35% 30%, #5a5a5a, #262626 55%, #0c0c0c); }
  .pinfo { min-width: 0; }
  .pname { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22vw; }
  .pmeta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .player.right .pmeta { justify-content: flex-end; }
  .pips { display: inline-flex; gap: 3px; }
  .pip { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--muted); opacity: .8; }
  .pip.on { background: var(--ink); border-color: var(--ink); opacity: 1; }
  .sets { color: var(--brass); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rules a { color: var(--brass); }
  .sources { margin: 4px 0 0; padding-left: 18px; color: #e4d9c4; }
  .sources li { margin: 3px 0; }
  .debt { color: var(--bad); font-weight: 600; }
  .center { text-align: center; min-width: 0; }
  #setinfo { font-family: var(--serif); font-size: 17px; letter-spacing: .02em; }
  #status { font-size: 12.5px; color: var(--muted); min-height: 1.45em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #setinfo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 4px; }
  .icon {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .icon:hover { background: rgba(255,255,255,0.09); }
  .icon:focus-visible, .seg button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon.off { color: var(--muted); opacity: .6; }
  .switch { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 36px; height: 20px; border-radius: 10px; background: rgba(255,255,255,.12); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .switch input:checked + .track { background: rgba(220,174,88,.35); border-color: rgba(220,174,88,.6); }
  .switch input:checked + .track::after { transform: translateX(16px); background: var(--brass); }
  .switch input:focus-visible + .track { outline: 2px solid var(--brass); outline-offset: 2px; }

  .icon { position: relative; }
  .icon .badge { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: none; }
  .icon.unread .badge { display: block; }
  .icon.small { width: 28px; height: 28px; border-radius: 8px; }
  .icon.small svg { width: 14px; height: 14px; }

  /* ---- log & chat ---- */
  #logpanel {
    position: fixed; z-index: 2; display: none; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); overflow: hidden;
  }
  #logpanel.show { display: flex; }
  .loghead { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #log { list-style: none; margin: 0; padding: 8px 10px; overflow-y: auto; flex: 1; min-height: 0; font-size: 13px; line-height: 1.4; user-select: text; -webkit-user-select: text; overscroll-behavior: contain; }
  #log li { padding: 4px 8px; border-left: 2px solid transparent; margin: 2px 0; border-radius: 0 6px 6px 0; }
  #log li.new { animation: lognew 1.6s ease-out; }
  @keyframes lognew { from { background: rgba(220,174,88,.22); } to { background: transparent; } }
  #log li.good { border-left-color: var(--good); }
  #log li.bad { border-left-color: var(--bad); }
  #log li.info { border-left-color: rgba(255,234,200,.25); color: #e4d9c4; }
  #log li.set { border-left-color: var(--brass); background: rgba(220,174,88,.08); color: var(--ink); }
  #log li.sep { border: 0; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; text-align: center; padding: 8px 0 2px; }
  #log li.chat { color: var(--ink); }
  #log li.chat .who { font-weight: 650; margin-right: 6px; }
  #log li.chat .who::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; background: var(--muted); }
  #log li.chat.s0 .who::before { background: var(--red); }
  #log li.chat.s1 .who::before { background: #111; box-shadow: 0 0 0 1px var(--muted); }
  #log b { font-weight: 650; }
  #chat { display: none; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  #chat.show { display: flex; }
  #chat input { flex: 1; min-width: 0; }
  #chat .btn { flex: none; padding: 8px 12px; }

  /* ---- toasts & banner ---- */
  #toasts { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3; display: flex; flex-direction: column; gap: 6px; width: min(560px, calc(100vw - 32px)); pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--muted); padding: 8px 12px; border-radius: 9px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: tin .25s ease-out; transition: opacity .5s, transform .5s; }
  .toast.good { border-left-color: var(--good); }
  .toast.bad { border-left-color: var(--bad); }
  .toast.gone { opacity: 0; transform: translateY(6px); }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } }
  #banner { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; font-family: var(--serif); font-size: clamp(26px, 5vw, 44px); text-shadow: 0 3px 18px rgba(0,0,0,.8); opacity: 0; white-space: nowrap; }
  #banner.show { animation: banner 1.5s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -40%); } 18%, 70% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -55%); } }

  /* ---- overlays ---- */
  .overlay { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; padding: 16px; background: rgba(10, 8, 6, 0.55); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  .overlay.open { display: grid; }
  .card { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); width: min(460px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 26px 26px 22px; user-select: text; -webkit-user-select: text; }
  .card.wide { width: min(680px, 100%); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 44px; margin: 0; letter-spacing: .01em; line-height: 1.05; }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; margin: 0 0 6px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--brass); margin: 18px 0 4px; font-weight: 650; }
  .tag { color: var(--muted); margin: 4px 0 18px; }
  .field { margin: 14px 0 0; }
  .field > label:not(.switch), .field > .label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .seg { display: flex; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 14px; }
  .seg button.on { background: rgba(220, 174, 88, 0.18); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(220,174,88,.5); }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input[type=text] { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; color: var(--ink); font: inherit; }
  input[type=text]:disabled { opacity: .55; }
  .row { display: flex; gap: 8px; margin-top: 22px; }
  .btn { flex: 1; border-radius: 10px; padding: 11px 14px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); cursor: pointer; font-weight: 600; }
  .btn:hover { background: rgba(255,255,255,0.1); }
  .btn.primary { background: var(--brass); color: #1b130a; border-color: transparent; }
  .btn.primary:hover { background: #e8bd6a; }
  .rules p { margin: 0 0 6px; color: #e4d9c4; }
  .rules .note { color: var(--muted); font-size: 13px; }
  .legend { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; border: 2px dashed; }
  .legend.dark { border-color: #3f7fc9; }
  kbd { font: 12px var(--sans); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .linkrow { display: flex; gap: 6px; margin-top: 4px; }
  .linkrow input { flex: 1; min-width: 0; font-size: 13.5px; user-select: all; -webkit-user-select: all; }
  .linkrow .btn { flex: none; padding: 8px 12px; }
  .waiting { display: flex; align-items: center; gap: 10px; color: #e4d9c4; margin: 18px 0 0; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(220,174,88,.3); border-top-color: var(--brass); animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2.sub { font-size: 20px; color: #e4d9c4; margin: 10px 0 0; }
  .error { color: var(--bad); margin: 8px 0 0; }
  .error:empty { display: none; }
  .btn:disabled { opacity: .45; cursor: default; }
  #result-score { font-family: var(--serif); font-size: 40px; margin: 6px 0 4px; letter-spacing: .04em; }
  #result-text { color: #e4d9c4; }

  @media (max-width: 720px) {
    #hud { grid-template-columns: 1fr 1fr; grid-template-areas: "c n" "a b"; gap: 4px 8px; padding: max(6px, env(safe-area-inset-top)) 8px 6px; }
    #p0 { grid-area: a; } #p1 { grid-area: b; } nav { grid-area: n; justify-self: end; align-self: start; } .center { grid-area: c; text-align: left; }
    .pname { max-width: 30vw; }
    .player { padding: 4px 6px; gap: 7px; }
    .pmeta { gap: 6px; }
    .pip { width: 6px; height: 6px; }
    .disc { width: 20px; height: 20px; }
    #setinfo { font-size: 15px; }
    #status { max-width: none; white-space: normal; font-size: 12px; line-height: 1.3; height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .icon { width: 30px; height: 30px; border-radius: 8px; }
    .icon svg { width: 16px; height: 16px; }
    nav { gap: 2px; }
    h1 { font-size: 36px; }
    .card { padding: 20px 18px 18px; }
  }
</style>
</head>
<body>
<canvas id="table" aria-label="Novuss table"></canvas>

<header id="hud">
  <div class="player" id="p0">
    <span class="disc red"></span>
    <div class="pinfo"><div class="pname"></div><div class="pmeta"><span class="sets"></span><span class="pips"></span><span class="debt"></span></div></div>
  </div>
  <div class="center"><div id="setinfo"></div><div id="status"></div></div>
  <div class="player right" id="p1">
    <span class="disc black"></span>
    <div class="pinfo"><div class="pname"></div><div class="pmeta"><span class="sets"></span><span class="pips"></span><span class="debt"></span></div></div>
  </div>
  <nav>
    <button class="icon" id="btn-menu" data-i18n-title="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="icon" id="btn-rules" data-i18n-title="rules"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.5M12 17.2v.1"/></svg></button>
    <button class="icon" id="btn-log" data-i18n-title="logTitle"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/><path d="M9 9h6M9 12h4"/></svg><span class="badge"></span></button>
    <button class="icon" id="btn-sound" data-i18n-title="sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  </nav>
</header>

<aside id="logpanel" aria-labelledby="log-title">
  <div class="loghead"><span id="log-title" data-i18n="logTitle"></span><button class="icon small" id="log-close" data-i18n-title="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <ol id="log" aria-live="polite"></ol>
  <form id="chat" autocomplete="off">
    <input type="text" id="chat-input" maxlength="300" data-i18n-placeholder="chatPlaceholder">
    <button class="btn" type="submit" data-i18n="send"></button>
  </form>
</aside>

<div id="toasts" aria-live="polite"></div>
<div id="banner"></div>

<div class="overlay" id="menu" role="dialog" aria-modal="true">
  <div class="card">
    <h1>Novuss</h1>
    <p class="tag" data-i18n="tagline"></p>
    <div class="field">
      <span class="label" data-i18n="opponent"></span>
      <div class="seg" data-setting="mode">
        <button data-value="ai" data-i18n="vsAI"></button>
        <button data-value="hotseat" data-i18n="vsHuman"></button>
        <button data-value="online" data-i18n="vsOnline"></button>
      </div>
      <p class="hint" id="online-note" data-i18n="onlineNote"></p>
    </div>
    <div class="field" id="field-level">
      <span class="label" data-i18n="level"></span>
      <div class="seg" data-setting="level">
        <button data-value="easy" data-i18n="easy"></button>
        <button data-value="medium" data-i18n="medium"></button>
        <button data-value="hard" data-i18n="hard"></button>
      </div>
    </div>
    <div class="field">
      <span class="label" data-i18n="match"></span>
      <div class="seg" data-setting="sets">
        <button data-value="1" data-i18n="sets1"></button>
        <button data-value="2" data-i18n="sets3"></button>
        <button data-value="3" data-i18n="sets5"></button>
      </div>
    </div>
    <div class="field">
      <span class="label" data-i18n="names"></span>
      <div class="names">
        <input type="text" id="name0" maxlength="20" autocomplete="off">
        <input type="text" id="name1" maxlength="20" autocomplete="off">
      </div>
    </div>
    <div class="field">
      <span class="label" data-i18n="helpers"></span>
      <label class="switch"><input type="checkbox" id="opt-guide"><span class="track" aria-hidden="true"></span><span data-i18n="guide"></span></label>
      <label class="switch"><input type="checkbox" id="opt-hints"><span class="track" aria-hidden="true"></span><span data-i18n="hints"></span></label>
      <p class="hint" data-i18n="helpersNote"></p>
    </div>
    <div class="field">
      <span class="label" data-i18n="language"></span>
      <div class="seg" data-setting="lang">
        <button data-value="lv">Latviešu</button>
        <button data-value="en">English</button>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="btn-resume" data-i18n="resume"></button>
      <button class="btn primary" id="btn-start" data-i18n="start"></button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btn-menu-rules" data-i18n="about"></button>
    </div>
  </div>
</div>

<div class="overlay" id="rules" role="dialog" aria-modal="true">
  <div class="card wide">
    <h2 data-i18n="rulesTitle"></h2>
    <div class="rules" id="rules-body"></div>
    <div class="row"><button class="btn primary" id="btn-rules-close" data-i18n="close"></button></div>
  </div>
</div>

<div class="overlay" id="lobby" role="dialog" aria-modal="true">
  <div class="card">
    <h2 data-i18n="lobbyTitle"></h2>
    <div id="lobby-invite">
      <p class="tag" data-i18n="lobbyText"></p>
      <div class="linkrow">
        <input type="text" id="lobby-link" readonly aria-label="Link">
        <button class="btn" id="lobby-copy" data-i18n="copy"></button>
        <button class="btn" id="lobby-share" data-i18n="share"></button>
      </div>
    </div>
    <p class="waiting"><span class="spinner" aria-hidden="true"></span><span id="lobby-status"></span></p>
    <div class="row"><button class="btn" id="lobby-cancel" data-i18n="cancel"></button></div>
  </div>
</div>

<div class="overlay" id="join" role="dialog" aria-modal="true">
  <div class="card">
    <h1>Novuss</h1>
    <h2 class="sub" data-i18n="joinTitle"></h2>
    <p class="tag" id="join-text"></p>
    <p class="error" id="join-error"></p>
    <div class="field">
      <label for="join-name" data-i18n="yourName"></label>
      <input type="text" id="join-name" maxlength="20" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn" id="btn-join-menu" data-i18n="backToMenu"></button>
      <button class="btn" id="btn-watch" data-i18n="watch"></button>
      <button class="btn primary" id="btn-join" data-i18n="join"></button>
    </div>
  </div>
</div>

<div class="overlay" id="result" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="result-title"></h2>
    <div id="result-score"></div>
    <p id="result-text"></p>
    <div class="row"><button class="btn primary" id="btn-result"></button></div>
  </div>
</div>

<script src="version.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
